<!DOCTYPE html> <!-- HTML5-pagina -->
<!-- Dit is de homepage van mijn site, met de layout uit mijn schets -->
<html>
    <head>
        <title>DE GROTE KOOKWEBSITE</title> <!-- Tekst in het tabblad -->
        <meta charset="utf-8"> <!-- Speciale tekens goed tonen -->
        <link rel="stylesheet" type="text/css" href="opmaak.css"> <!-- Koppeling naar het CSS-bestand -->
    </head>
    <body>

        <!-- KOP: de grote groene balk bovenaan met de titel -->
        <div class="kop">
            <div class="kop-titel">DE GROTE KOOKWEBSITE</div> <!-- Het vak met 'titel' uit de schets -->
        </div>

        <!-- PAGINA: bevat de zijbalk (links) en de inhoud (rechts) naast elkaar -->
        <div class="pagina">

            <!-- ZIJBALK: het menu links met twee uitklapblokken -->
            <div class="zijbalk">

                <!-- Uitklapblok 1: 'open' zorgt dat het standaard openstaat -->
                <details open>
                    <summary>Onderwerpen</summary> <!-- De groene balk met titel en pijltje; hierop klik je -->
                    <div class="blok-wit"> <!-- Het witte vak met de ondertitels -->
                        <a href="binairstelsel.html">Binair stelsel</a> <!-- Ondertitel 1 -->
                        <a href="kleurmodel.html">Kleurmodellen</a> <!-- Ondertitel 2 -->
                    </div>
                </details>

                <!-- Uitklapblok 2: staat standaard dicht (geen 'open') -->
                <details>
                    <summary>Over mij</summary>
                    <div class="blok-grijs"> <!-- Het grijze vak uit de schets -->
                        <a href="index.html">Home</a>
                    </div>
                </details>

            </div> <!-- Einde zijbalk -->

            <!-- INHOUD: het grote witte vak rechts met de afbeelding -->
            <div class="inhoud">
                <!-- Afbeelding: de naam moet exact kloppen met het geuploade bestand (let op hoofdletters) -->
                <img src="Chefkok.jpg" alt="chefkok">
            </div>

        </div> <!-- Einde pagina -->

    </body>
</html>
