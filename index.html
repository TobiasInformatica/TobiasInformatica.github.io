<!DOCTYPE html> <!-- HTML5-pagina -->
<!-- Dit is de homepage van mijn site (altijd index.html in de hoofdmap) -->
<html lang="nl">
    <head>
        <title>De Grote Kookwebsite</title> <!-- Tekst in het tabblad -->
        <meta charset="utf-8"> <!-- Speciale tekens (é, ë) goed tonen -->
        <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Zorgt dat de site ook op een telefoon goed past -->
        <link rel="stylesheet" type="text/css" href="opmaak.css"> <!-- Koppeling naar het opmaakbestand -->
    </head>
    <body>

        <!-- KOP: de groene balk bovenaan -->
        <header class="kop">
            <h1>De Grote Kookwebsite</h1> <!-- Hoofdtitel -->
            <p>van de enige echte Tobias den Hollander</p> <!-- Ondertitel -->
        </header>

        <!-- PAGINA: zijbalk links en inhoud rechts naast elkaar -->
        <div class="pagina">

            <!-- ZIJBALK: twee uitklapblokken -->
            <nav class="zijbalk">

                <!-- Blok 1: 'open' = standaard uitgeklapt -->
                <details open>
                    <summary>Menu</summary> <!-- Titelbalk waar je op klikt -->
                    <div class="blok">
                        <a href="index.html">Home</a>
                        <a href="binairstelsel.html">Binair stelsel</a>
                        <a href="kleurmodel.html">Kleurmodellen</a>
                    </div>
                </details>

                <!-- Blok 2: standaard dicht -->
                <details>
                    <summary>Over de kok</summary>
                    <div class="blok">
                        <p>Hier vertel ik iets over mezelf en over mijn liefde voor koken.</p>
                    </div>
                </details>

            </nav>

            <!-- INHOUD: de hoofdkolom rechts -->
            <main class="inhoud">
                <h2>Welkom in mijn keuken</h2> <!-- Titel van de pagina -->
                <p>Gezellig, eerlijk en vol smaak. Schuif aan en kijk rond!</p> <!-- Inleiding -->

                <!-- Afbeelding in een lijst-kader. Let op de hoofdletter: Chefkok.jpg -->
                <figure>
                    <img src="Chefkok.jpg" alt="Chefkok die een bord aanricht">
                    <figcaption>Met aandacht gemaakt, zoals het hoort.</figcaption> <!-- Bijschrift -->
                </figure>
            </main>

        </div>

        <!-- VOET: onderaan de pagina -->
        <footer class="voet">
            <p>Gemaakt met liefde en een beetje HTML</p>
        </footer>

    </body>
</html>
